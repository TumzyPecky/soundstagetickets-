<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Distributors | Sound Stage Tickets Admin</title>
<link rel="stylesheet" href="/assets/styles.css" />
<style>
  .dist-search {
    max-width: 320px;
    margin-bottom: 16px;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-card {
    width: 420px;
    max-width: 100%;
    border-radius: 16px;
    padding: 22px;
  }
</style>
</head>
<body>
<script src="/assets/icons.js"></script>
<script src="/assets/api.js"></script>
<script src="/assets/shell.js"></script>
<script>
  let allDistributors = [];

  function renderRows(list) {
    const body = document.getElementById("dist-body");
    if (!list.length) {
      body.innerHTML = `<tr><td colspan="8" style="text-align:center;color:rgba(232,238,252,0.4);padding:24px;">No distributors found.</td></tr>`;
      return;
    }
    body.innerHTML = list
      .map(
        (d) => `
      <tr data-id="${d.id}">
        <td class="strong">${d.name}</td>
        <td>${d.referralCode}</td>
        <td>${statusPill(d.status)}</td>
        <td class="strong">${d.clicks.toLocaleString()}</td>
        <td>${d.ticketsSold.toLocaleString()}</td>
        <td>${formatNaira(d.revenue)}</td>
        <td>${formatNaira(d.commissionTotal)}</td>
        <td>
          <button class="btn btn-secondary btn-sm login-btn">
            ${d.portalUsername ? "Reset Login" : "Set Portal Login"}
          </button>
        </td>
      </tr>`
      )
      .join("");

    list.forEach((d) => {
      const tr = document.querySelector(`tr[data-id="${d.id}"]`);
      const btn = tr && tr.querySelector(".login-btn");
      if (btn) btn.addEventListener("click", () => openLoginModal(d));
    });
  }

  (async function () {
    const admin = await requireAdminSession();
    if (!admin) return;

    renderAdminShell("/distributors.html", `
      <h1>Distributors</h1>
      <p class="sub">Everyone with a referral link, and how many clicks it's driven.</p>

      <div class="search-input-wrap dist-search" style="margin-top:20px;">
        ${Icon("search", { size: 16 })}
        <input id="dist-search-input" class="glass-input" placeholder="Search by name or code…" />
      </div>

      <div class="table-wrap glass">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Referral Code</th>
              <th>Status</th>
              <th>Clicks</th>
              <th>Tickets Sold</th>
              <th>Revenue</th>
              <th>Commission</th>
              <th>Portal Login</th>
            </tr>
          </thead>
          <tbody id="dist-body"><tr><td colspan="8" style="text-align:center;padding:24px;color:rgba(232,238,252,0.4);">Loading…</td></tr></tbody>
        </table>
      </div>
    `);

    try {
      const data = await api("/api/admin/distributors");
      allDistributors = data.distributors || [];
      renderRows(allDistributors);
    } catch (err) {
      document.getElementById("admin-content").innerHTML += `<p style="color:#f87171;margin-top:16px;">${err.message}</p>`;
      return;
    }

    document.getElementById("dist-search-input").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) return renderRows(allDistributors);
      renderRows(
        allDistributors.filter(
          (d) => d.name.toLowerCase().includes(q) || (d.referralCode || "").toLowerCase().includes(q)
        )
      );
    });
  })();

  function openLoginModal(distributor) {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-card glass-raised">
        <h3 style="color:white;font-size:16px;margin-bottom:4px;">Portal Login for ${distributor.name}</h3>
        <p style="color:rgba(232,238,252,0.5);font-size:13px;margin-bottom:16px;">
          ${distributor.portalUsername
            ? `Currently: <strong style="color:white;">${distributor.portalUsername}</strong>. Set a new username/password to reset.`
            : "Set a username and password this distributor will use to sign in to the distributor portal."}
        </p>
        <form id="login-form">
          <label style="display:block;margin-bottom:12px;">
            <span style="display:block;font-size:12px;color:rgba(232,238,252,0.6);margin-bottom:4px;">Username</span>
            <input id="portal-username" class="glass-input" style="width:100%;" minlength="3" required value="${distributor.portalUsername || ""}" />
          </label>
          <label style="display:block;margin-bottom:16px;">
            <span style="display:block;font-size:12px;color:rgba(232,238,252,0.6);margin-bottom:4px;">Password (min 8 characters)</span>
            <input type="text" id="portal-password" class="glass-input" style="width:100%;" minlength="8" required />
          </label>
          <div id="login-error" style="color:#f87171;font-size:12px;margin-bottom:12px;"></div>
          <div style="display:flex;gap:10px;">
            <button type="button" id="login-cancel" class="btn btn-secondary btn-sm" style="flex:1;">Cancel</button>
            <button type="submit" id="login-submit" class="btn btn-primary btn-sm" style="flex:1;">Save Login</button>
          </div>
        </form>
      </div>`;
    document.body.appendChild(overlay);

    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    document.getElementById("login-cancel").addEventListener("click", () => overlay.remove());

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";
      const submitBtn = document.getElementById("login-submit");
      submitBtn.disabled = true;
      submitBtn.textContent = "Saving…";

      try {
        await api(`/api/admin/distributors/${distributor.id}/set-login`, {
          method: "POST",
          body: JSON.stringify({
            username: document.getElementById("portal-username").value.trim(),
            password: document.getElementById("portal-password").value,
          }),
        });
        overlay.remove();
        // Refresh the table so the button text updates
        const data = await api("/api/admin/distributors");
        allDistributors = data.distributors || [];
        renderRows(allDistributors);
      } catch (err) {
        errorEl.textContent = err.message || "Could not save login.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Save Login";
      }
    });
  }
</script>
</body>
</html>
